[project]
name = "tokenizer-explorer"
version = "0.1.0"
description = "Tokenizer exploration and analysis tool"
requires-python = ">=3.10"
dependencies = [
    "datasets>=5.0.1",
    "fastapi>=0.110",
    "protobuf>=7.36.1",
    "pydantic>=2.7",
    "sentencepiece>=0.2",
    "tiktoken>=0.7",
    "tokenizer-intrinsic-evals",
    "tokenizers>=0.19",
    "torch>=2.10.0",
    "transformers>=4.40",
    "unicodedata2>=15.1.0",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
]

[tool.ruff]
line-length = 100

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
tokenizer-intrinsic-evals = { git = "https://github.com/cimeister/tokenizer-intrinsic-evals.git" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


