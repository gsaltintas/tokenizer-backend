[project]
name = "tokenizer-explorer"
version = "0.1.0"
description = "Tokenizer exploration and analysis tool"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "fastapi>=0.110",
    "protobuf>=7.36.1",
    "pydantic>=2.7",
    "script-bpe",
    "sentencepiece>=0.2",
    "tiktoken>=0.7",
    "tokenizer-intrinsic-evals",
    "tokenizers>=0.19",
    "tokenmonster>=1.1.12",
    "torch>=2.10.0",
    "transformers>=4.40",
    "unicodedata2>=15.1.0",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
]

[tool.ruff]
line-length = 100

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
tokenizer-intrinsic-evals = { git = "https://github.com/cimeister/tokenizer-intrinsic-evals.git" }
script-bpe = { git = "https://github.com/sanderland/script_tok" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true



[tool.uv]
# script-bpe caps huggingface-hub below 1.0, which would pin transformers to 4.x. It only uses
# the hub (via datasets) for training corpora, not for loading tokenizers.
override-dependencies = ["huggingface-hub>=1.0"]
